<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="color-scheme" content="dark light">
<title>belt-drive — timing-belt reduction designer</title>
<link rel="icon" href="data:,">
<link data-trunk rel="rust" href="crates/bd_web/Cargo.toml">
<link data-trunk rel="copy-file" href="web/boot.js">
<style>
:root {
  --bg: #0e1116; --panel: rgba(22, 26, 33, 0.92); --card: #1a1f27; --line: #2c333e;
  --text: #e6e9ee; --muted: #9aa3b0; --accent: #f0a030; --accent2: #4aa8ff;
  --ok: #3ccf7a; --warn: #f2c14e; --fail: #ff5d5d; --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #eef1f5; --panel: rgba(255, 255, 255, 0.94); --card: #ffffff; --line: #d6dbe3;
    --text: #1b2028; --muted: #5b6573; --accent: #c87000; --accent2: #1a6fd1;
    --ok: #1c9a52; --warn: #b88400; --fail: #d12c2c;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
#stage { position: fixed; inset: 0; }
#view { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#nogl { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dim { position: absolute; transform: translate(-50%, -50%); font: 12px var(--mono); padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,0.55); color: #fff; white-space: nowrap; }
#toolbar { position: absolute; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: calc(100% - 24px); padding: 6px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); }
#toolbar .sep { width: 1px; height: 22px; background: var(--line); }
.tb { min-width: 34px; height: 30px; padding: 0 9px; border-radius: 7px; border: 1px solid transparent; background: transparent; cursor: pointer; white-space: nowrap; }
.tb:hover { background: var(--card); border-color: var(--line); }
.tb.on { background: var(--accent); color: #111; }
#toolbar select { height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); padding: 0 6px; }
#time { width: 110px; accent-color: var(--accent); }
#hud { position: absolute; left: 12px; bottom: 12px; padding: 10px 12px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); font: 12px/1.5 var(--mono); display: grid; grid-template-columns: auto auto; gap: 0 14px; max-width: calc(100% - 24px); pointer-events: none; }
#hud .k { color: var(--muted); font-family: var(--font); }
#hud .st { grid-column: 1 / 3; font-family: var(--font); font-weight: 600; margin-top: 4px; }
.s-ok { color: var(--ok); } .s-warn { color: var(--warn); } .s-fail { color: var(--fail); }
#panel { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
#panel.hidden { display: none; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
summary { cursor: pointer; padding: 9px 12px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
summary::after { content: "▾"; color: var(--muted); }
details:not([open]) summary::after { content: "▸"; }
.body { padding: 0 12px 12px; display: grid; grid-template-columns: 1fr 110px; gap: 6px 10px; align-items: center; }
.body.wide { display: block; }
.body label { color: var(--muted); }
.body input, .body select { width: 100%; height: 30px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); }
.body select.full { grid-column: 1 / 3; }
.hint2 { grid-column: 1 / 3; color: var(--muted); font-size: 12px; }
#checks { list-style: none; margin: 0; padding: 0; font-size: 13px; }
#checks li { padding: 3px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
#checks li:last-child { border-bottom: 0; }
#checks b { min-width: 52px; }
canvas.plot { width: 100%; height: 170px; display: block; margin-top: 6px; border-radius: 7px; background: var(--card); }
.ptitle { color: var(--muted); font-size: 12px; margin-top: 8px; }
#s-go { grid-column: 1 / 3; height: 32px; border-radius: 7px; border: 0; background: var(--accent); color: #111; font-weight: 600; cursor: pointer; }
#s-res { width: 100%; border-collapse: collapse; font: 12px var(--mono); margin-top: 8px; }
#s-res th { text-align: left; color: var(--muted); font-weight: 500; font-family: var(--font); }
#s-res td, #s-res th { padding: 3px 4px; border-bottom: 1px solid var(--line); }
#s-res tbody tr { cursor: pointer; }
#s-res tbody tr:hover { background: var(--card); }
#s-msg { color: var(--muted); font-size: 12px; margin-top: 6px; }
#hint { position: absolute; top: 60px; left: 12px; max-width: 360px; padding: 10px 34px 10px 12px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--accent); font-size: 13px; }
#hint.hidden { display: none; }
#hint-x { position: absolute; top: 4px; right: 4px; }
[data-tip] { position: relative; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; top: 36px; left: 0; z-index: 9; padding: 4px 8px; border-radius: 6px; background: #000; color: #fff; font-size: 12px; white-space: nowrap; pointer-events: none; }
#disclaimer { color: var(--muted); font-size: 11px; padding: 2px 4px 8px; }
@media (max-width: 760px) {
  #toolbar { top: 6px; left: 6px; max-width: calc(100% - 12px); gap: 3px; padding: 4px; }
  #toolbar .sep { display: none; }
  .tb { height: 28px; padding: 0 6px; min-width: 28px; font-size: 13px; }
  #toolbar select { height: 28px; font-size: 13px; }
  #time { width: 70px; }
  #stage { bottom: 42vh; }
  #panel { position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 42vh; padding: 8px; background: var(--panel); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; }
  #hud { left: 6px; right: auto; bottom: 6px; padding: 5px 8px; font-size: 10px; line-height: 1.35; grid-template-columns: auto auto; gap: 0 8px; max-height: calc(58vh - 110px); overflow: auto; pointer-events: auto; cursor: pointer; }
  #hud:not(.open) > :nth-child(n+3):not(.st) { display: none; }
  #hud .st::after { content: " ▸"; color: var(--muted); }
  #hud.open .st::after { content: " ▾"; }
  #hint { top: 92px; left: 6px; right: 6px; max-width: none; font-size: 12px; }
  [data-tip]:hover::after { display: none; }
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" tabindex="0"></canvas>
  <div id="nogl" data-i18n="nogl"></div>
  <div id="labels"></div>
  <div id="toolbar">
    <button class="tb" id="b-play" data-tipk="t_play">❚❚</button>
    <select id="speed" data-tipk="t_speed">
      <option value="1">1×</option><option value="0.25" selected>0.25×</option><option value="0.05">0.05×</option>
    </select>
    <input id="time" type="range" min="0" max="1000" value="0" data-tipk="t_time">
    <span class="sep"></span>
    <button class="tb on" id="b-tension" data-i18n="b_tension" data-tipk="t_tension"></button>
    <button class="tb" id="b-defl" data-i18n="b_defl" data-tipk="t_defl"></button>
    <button class="tb" id="b-force" data-i18n="b_force" data-tipk="t_force"></button>
    <button class="tb on" id="b-dims" data-i18n="b_dims" data-tipk="t_dims"></button>
    <span class="sep"></span>
    <select id="preset" data-tipk="t_view">
      <option value="0" data-i18n="v_persp"></option><option value="1" data-i18n="v_front"></option>
      <option value="2" data-i18n="v_side"></option><option value="3" data-i18n="v_close"></option>
    </select>
    <button class="tb" id="b-lang" data-tipk="t_lang">한/EN</button>
    <button class="tb" id="b-panel" data-tipk="t_panel">☰</button>
  </div>
  <div id="hud"></div>
  <div id="hint"><span data-i18n="hint"></span><button class="tb" id="hint-x" aria-label="close">✕</button></div>
  <div id="panel">
    <details open>
      <summary data-i18n="c_drive"></summary>
      <div class="body">
        <select id="profile" class="full"></select>
        <label for="stages" data-i18n="l_stages"></label><select id="stages"><option value="1">1</option><option value="2" selected>2</option></select>
        <label for="width" data-i18n="l_width"></label><input id="width" type="number" min="3" max="100" step="1" value="15">
        <label for="mt" data-i18n="l_mt"></label><input id="mt" type="number" min="0" step="0.05" value="0.35">
        <label for="rpm" data-i18n="l_rpm"></label><input id="rpm" type="number" min="0" step="100" value="4000">
        <label for="ot" data-i18n="l_ot"></label><input id="ot" type="number" min="0" step="0.1" value="3">
        <label for="pf" data-i18n="l_pf"></label><input id="pf" type="number" min="0" max="2" step="0.05" value="0.5">
        <label for="sf" data-i18n="l_sf"></label><input id="sf" type="number" min="1" max="3" step="0.1" value="1.4">
      </div>
    </details>
    <details open>
      <summary data-i18n="c_stage1"></summary>
      <div class="body">
        <label for="z1a" data-i18n="l_z1"></label><input id="z1a" type="number" min="6" max="200" step="1" value="16">
        <label for="z2a" data-i18n="l_z2"></label><input id="z2a" type="number" min="6" max="300" step="1" value="48">
        <label for="ca" data-i18n="l_c"></label><input id="ca" type="number" min="5" step="0.5" value="45">
      </div>
    </details>
    <details open id="card2">
      <summary data-i18n="c_stage2"></summary>
      <div class="body">
        <label for="z1b" data-i18n="l_z1"></label><input id="z1b" type="number" min="6" max="200" step="1" value="18">
        <label for="z2b" data-i18n="l_z2"></label><input id="z2b" type="number" min="6" max="300" step="1" value="54">
        <label for="cb" data-i18n="l_c"></label><input id="cb" type="number" min="5" step="0.5" value="50">
      </div>
    </details>
    <details open>
      <summary data-i18n="c_checks"></summary>
      <div class="body wide"><ul id="checks"></ul></div>
    </details>
    <details open>
      <summary data-i18n="c_plots"></summary>
      <div class="body wide">
        <div class="ptitle" data-i18n="p_k"></div><canvas class="plot" id="plot-k"></canvas>
        <div class="ptitle" data-i18n="p_t"></div><canvas class="plot" id="plot-t"></canvas>
      </div>
    </details>
    <details>
      <summary data-i18n="c_search"></summary>
      <div class="body">
        <label for="s-ratio" data-i18n="l_sratio"></label><input id="s-ratio" type="number" min="1" step="0.1" value="9">
        <label for="s-tol" data-i18n="l_stol"></label><input id="s-tol" type="number" min="0" max="50" step="0.5" value="3">
        <label for="s-stages" data-i18n="l_stages"></label><select id="s-stages"><option value="1">1</option><option value="2" selected>2</option></select>
        <button id="s-go" data-i18n="b_search"></button>
      </div>
      <div class="body wide"><div id="s-msg"></div><table id="s-res"><thead></thead><tbody></tbody></table></div>
    </details>
    <div id="disclaimer" data-i18n="disclaimer"></div>
  </div>
</div>
</body>
</html>
